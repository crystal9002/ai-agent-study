<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLMOps 评估仪表盘</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222c; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa3b2; --accent: #7c5cff; --accent2: #35c28d;
    --warn: #ffb454; --danger: #ff6b6b; --info: #4aa8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system,
    "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 13px 22px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; font-weight: 600; }
  .pill { font-size: 12px; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
  .pill b { color: var(--accent2); font-weight: 600; }
  .layout { flex: 1; display: grid; grid-template-columns: 360px 1fr; overflow: hidden; }
  aside { border-right: 1px solid var(--border); background: var(--panel);
    overflow-y: auto; padding: 16px 14px; }
  aside h3 { font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; margin: 14px 0 8px; }
  aside h3:first-child { margin-top: 0; }
  .run { cursor: pointer; border: 1px solid var(--border); background: var(--panel2);
    border-radius: 9px; padding: 8px 11px; margin-bottom: 7px; font-size: 13px; transition: .15s; }
  .run:hover { border-color: var(--accent); }
  .run.active { border-color: var(--accent); background: #241f3d; }
  .run .rid { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--muted);
    word-break: break-all; }
  .run .rname { font-weight: 600; margin: 2px 0; }
  .run .rmeta { color: var(--muted); font-size: 12px; }
  .kind { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 5px;
    padding: 0 6px; margin-right: 6px; }
  .kind.trace { background: #2b2350; color: #b7a6ff; }
  .kind.eval_rag { background: #14303f; color: #6fc3ff; }
  .kind.eval_agent { background: #143527; color: #6fe0ae; }
  main { overflow-y: auto; padding: 22px 26px; }
  .placeholder { color: var(--muted); text-align: center; margin-top: 14vh; }
  .placeholder h2 { color: var(--text); font-size: 20px; margin-bottom: 6px; }
  h2.sec { font-size: 15px; color: var(--accent); margin: 18px 0 10px; }
  .grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 11px;
    padding: 12px 16px; min-width: 120px; }
  .card .v { font-size: 21px; font-weight: 700; font-family: ui-monospace, monospace; }
  .card .l { font-size: 12px; color: var(--muted); }
  .card.good .v { color: var(--accent2); } .card.bad .v { color: var(--danger); }
  .card.info .v { color: var(--info); }
  /* span 树 */
  .span { border-left: 2px solid var(--border); margin-left: 10px; padding: 4px 0 6px 14px;
    position: relative; }
  .span::before { content: ""; position: absolute; left: -6px; top: 11px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--border); }
  .span.err::before { background: var(--danger); }
  .span .hd { font-size: 13.5px; }
  .span .hd b { font-family: ui-monospace, monospace; color: var(--accent); }
  .span .hd .t { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .span .io { background: var(--panel2); border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 9px; margin-top: 5px; font: 12px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all; color: #c9d3e5; max-height: 130px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
  th, td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; }
  th { background: var(--panel2); color: var(--accent); font-weight: 600; }
  td.mono { font-family: ui-monospace, monospace; }
  .pass { color: var(--accent2); font-weight: 700; } .fail { color: var(--danger); font-weight: 700; }
  .muted { color: var(--muted); font-size: 12.5px; }
  svg.trend { background: var(--panel); border: 1px solid var(--border); border-radius: 11px; margin: 8px 0; }
  .empty { color: var(--muted); padding: 14px; text-align: center; font-size: 13px;
    border: 1px dashed var(--border); border-radius: 9px; }
</style>
</head>
<body>
<header>
  <h1>📊 LLMOps 评估仪表盘</h1>
  <span class="pill">运行数 <b id="runCount">–</b></span>
  <span class="pill">评估 <b id="evalCount">–</b></span>
  <span class="pill" id="autoPill">8s 自动刷新</span>
</header>

<div class="layout">
  <aside>
    <h3>运行列表</h3>
    <div id="runs"><div class="empty">加载中…</div></div>
  </aside>
  <main id="main">
    <div class="placeholder">
      <h2>Trace 树 · 评估趋势 · 回归对比</h2>
      <p>左侧选择一次运行查看 span 树与指标；下方是全部评估历史趋势。</p>
    </div>
    <div id="trendSection"></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const trunc = (t, n=300) => t && t.length > n ? t.slice(0,n)+'…' : t;
let runs = [], selectedId = null;

const KIND_LABEL = {trace: '追踪', eval_rag: 'RAG评估', eval_agent: 'Agent评估'};

async function loadRuns() {
  try {
    const d = await (await fetch('/api/runs')).json();
    runs = d.runs || [];
    $('#runCount').textContent = runs.length;
    renderRunList();
  } catch (e) { $('#runs').innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`; }
}

function renderRunList() {
  if (!runs.length) { $('#runs').innerHTML = '<div class="empty">还没有运行记录，先跑 scripts/01~03</div>'; return; }
  $('#runs').innerHTML = runs.map(r => {
    const s = r.summary || {}, rep = r.report || {};
    const rate = rep.pass_rate != null ? ` · 通过率 ${(rep.pass_rate*100).toFixed(0)}%` : '';
    const tok = s.total_tokens ? ` · ${s.total_tokens} tok` : '';
    return `<div class="run ${r.run_id===selectedId?'active':''}" data-id="${esc(r.run_id)}">
      <div class="rid">${esc(r.run_id)}</div>
      <div class="rname"><span class="kind ${esc(r.kind)}">${KIND_LABEL[r.kind]||esc(r.kind)}</span>${esc(r.name)}</div>
      <div class="rmeta">${esc(r.ts)}${tok}${rate}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.run').forEach(el =>
    el.onclick = () => selectRun(el.dataset.id));
}

async function selectRun(id) {
  selectedId = id; renderRunList();
  let rec;
  try { rec = await (await fetch('/api/runs/'+encodeURIComponent(id))).json(); }
  catch (e) { $('#main').innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`; return; }
  renderDetail(rec);
}

function renderDetail(rec) {
  const s = rec.summary || {}, rep = rec.report || {};
  let html = `<h2 class="sec">运行详情 · ${esc(rec.run_id)}</h2>`;
  // 指标卡
  html += '<div class="grid">';
  if (rep.pass_rate != null)
    html += `<div class="card ${rep.pass_rate>=0.8?'good':'bad'}"><div class="v">${(rep.pass_rate*100).toFixed(0)}%</div><div class="l">通过率 (${rep.passed}/${rep.total})</div></div>`;
  const m = rep.metrics || {};
  for (const [k,v] of Object.entries(m).slice(0,5))
    html += `<div class="card info"><div class="v">${v==null?'—':v}</div><div class="l">${esc(k)}</div></div>`;
  const j = rep.judge || {};
  for (const [k,v] of Object.entries(j).slice(0,2))
    html += `<div class="card info"><div class="v">${v==null?'—':v}</div><div class="l">judge ${esc(k)}</div></div>`;
  if (s.total_tokens) html += `<div class="card"><div class="v">${s.total_tokens}</div><div class="l">总 tokens</div></div>`;
  if (s.total_cost_usd) html += `<div class="v-wrap card"><div class="v">$${s.total_cost_usd.toFixed(4)}</div><div class="l">估算成本</div></div>`;
  html += '</div>';

  // span 树
  if (rec.spans && rec.spans.length) {
    html += '<h2 class="sec">Span 树（按父子缩进）</h2>';
    const byParent = {};
    rec.spans.forEach(sp => { (byParent[sp.parent_id] = byParent[sp.parent_id]||[]).push(sp); });
    const walk = (pid) => (byParent[pid]||[]).map(sp => {
      const tok = (sp.prompt_tokens||sp.completion_tokens) ? ` · ${sp.prompt_tokens}+${sp.completion_tokens}tok` : '';
      const cost = sp.cost_usd ? ` · $${sp.cost_usd.toFixed(4)}` : '';
      const err = sp.error ? ` ❌ ${esc(sp.error)}` : '';
      return `<div class="span ${sp.error?'err':''}"><div class="hd"><b>${esc(sp.name)}</b>
        <span class="t">${sp.latency_ms}ms${tok}${cost}${err}</span></div>
        ${sp.inputs?`<div class="io">入: ${esc(trunc(sp.inputs,200))}</div>`:''}
        ${sp.output?`<div class="io">出: ${esc(trunc(sp.output,300))}</div>`:''}
        ${walk(sp.span_id)}</div>`;
    }).join('');
    html += `<div style="margin-top:8px">${walk(null)}</div>`;
  }

  // cases 明细
  if (rec.cases && rec.cases.length) {
    html += '<h2 class="sec">用例明细（badcase 回流入口）</h2><table><tr><th>ID</th><th>结果</th><th>指标</th><th>judge</th><th>答案/检索</th></tr>';
    for (const c of rec.cases) {
      const met = Object.entries(c.metrics||{}).map(([k,v])=>`${k}=${v}`).join(' ');
      const jd = c.judge ? Object.entries(c.judge).filter(([k])=>k!=='reasons').map(([k,v])=>`${k}=${v}`).join(' ') : (c.judge===null&&c.answer?'降级':'—');
      const ans = c.retrieved && c.retrieved.length ? `<div>${esc(c.retrieved.join(', '))}</div>`:'';
      html += `<tr><td class="mono">${esc(c.id)}</td>
        <td class="${c.passed?'pass':'fail'}">${c.passed?'✓':'✗'}</td>
        <td class="mono">${esc(met)}</td><td class="mono">${esc(jd)}</td>
        <td>${ans}<div class="muted">${esc(trunc(c.answer,140))}</div>${c.error?`<div class="fail">${esc(c.error)}</div>`:''}</td></tr>`;
    }
    html += '</table>';
  }
  $('#main').innerHTML = html + '<div id="trendSection"></div>';
  loadTrend();
}

// 评估历史：表格 + 简单 SVG 折线（pass_rate 趋势）
async function loadTrend() {
  let evals = [];
  try { evals = (await (await fetch('/api/evals')).json()).evals || []; } catch {}
  $('#evalCount').textContent = evals.length;
  const sec = document.querySelector('#trendSection');
  if (!sec) return;
  if (!evals.length) { sec.innerHTML = '<h2 class="sec">评估历史</h2><div class="empty">还没有评估记录，跑 scripts/02_eval_rag.py</div>'; return; }
  const rows = evals.slice().reverse(); // 时间正序展示
  let html = '<h2 class="sec">评估历史（时间正序）</h2>';
  html += '<table><tr><th>时间</th><th>类型</th><th>run_id</th><th>通过率</th><th>关键指标</th></tr>';
  for (const e of rows) {
    const r = e.report||{}, m=r.metrics||{}, j=r.judge||{};
    const bits = [];
    if (m['hit@3']!=null) bits.push('hit@3='+m['hit@3']);
    if (m.containment!=null) bits.push('containment='+m.containment);
    if (m.tools_ok!=null) bits.push('tools_ok='+m.tools_ok);
    if (m.turns!=null) bits.push('turns='+m.turns);
    if (j.faithfulness!=null) bits.push('faithfulness='+j.faithfulness);
    html += `<tr><td class="mono">${esc(e.ts)}</td>
      <td><span class="kind ${esc(e.kind)}">${KIND_LABEL[e.kind]||esc(e.kind)}</span></td>
      <td class="mono muted">${esc(e.run_id)}</td>
      <td class="mono">${r.pass_rate!=null?(r.pass_rate*100).toFixed(0)+'%':'—'}</td>
      <td class="mono">${esc(bits.join(' · '))}</td></tr>`;
  }
  html += '</table>';

  // SVG 折线：按 kind 分组画 pass_rate
  for (const kind of ['eval_rag','eval_agent']) {
    const pts = rows.filter(e => e.kind===kind && e.report && e.report.pass_rate!=null);
    if (pts.length < 1) continue;
    const W=560, H=120, PAD=28;
    const xs = i => pts.length===1 ? W/2 : PAD + i*(W-2*PAD)/(pts.length-1);
    const ys = v => H-PAD - v*(H-2*PAD);
    const path = pts.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(p.report.pass_rate).toFixed(1)}`).join(' ');
    const dots = pts.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.report.pass_rate).toFixed(1)}" r="4" fill="${kind==='eval_rag'?'#4aa8ff':'#35c28d'}"/>`).join('');
    const labels = pts.map((p,i)=>`<text x="${xs(i).toFixed(1)}" y="${H-8}" font-size="10" fill="#9aa3b2" text-anchor="middle">${p.ts.slice(5,16)}</text>`).join('');
    const vals = pts.map((p,i)=>`<text x="${xs(i).toFixed(1)}" ys="${(p.report.pass_rate*100).toFixed(0)}" y="${(ys(p.report.pass_rate)-8).toFixed(1)}" font-size="10" fill="#e6e9ef" text-anchor="middle">${(p.report.pass_rate*100).toFixed(0)}%</text>`).join('');
    html += `<div><div class="muted" style="margin-top:8px">${KIND_LABEL[kind]} · 通过率趋势</div>
      <svg class="trend" width="${W}" height="${H}">${path?`<path d="${path}" fill="none" stroke="${kind==='eval_rag'?'#4aa8ff':'#35c28d'}" stroke-width="2"/>`:''}${dots}${vals}${labels}</svg></div>`;
  }
  sec.innerHTML = html;
}

loadRuns();
loadTrend();
setInterval(() => { loadRuns(); loadTrend(); }, 8000);
</script>
</body>
</html>
