<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库问答 · RAG Tutorial</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222c; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa3b2; --accent: #4f8cff; --accent2: #35c28d;
    --danger: #ff6b6b; --user: #26418f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.65 -apple-system,
    "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; font-weight: 600; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    font-size: 12px; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px;
  }
  .pill b { color: var(--accent2); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 26px 0; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty h2 { font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .empty p { margin-bottom: 22px; }
  .examples { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .chip {
    cursor: pointer; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px;
    font-size: 13.5px; transition: .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .msg { display: flex; margin-bottom: 22px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; border-radius: 14px; padding: 12px 16px; white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .msg.bot .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; min-width: 46%;
  }
  .dot { display: inline-block; width: 7px; height: 7px; margin: 0 4px 2px 0;
    border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
  .cite { color: var(--accent); font-weight: 600; cursor: help; }
  .sources { margin-top: 12px; display: grid; gap: 8px; }
  .src {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 9px; padding: 9px 12px; font-size: 13px;
  }
  .src .head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .src .n {
    background: var(--accent); color: #fff; border-radius: 6px;
    font-size: 11.5px; font-weight: 700; padding: 1px 7px;
  }
  .src .doc { color: var(--accent2); font-weight: 600; font-size: 12.5px; }
  .src .txt { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .err { background: #3a1d22; border: 1px solid #7a2e35; color: #ffb4b4;
    border-radius: 10px; padding: 10px 14px; font-size: 13.5px; margin-top: 10px; }
  footer {
    border-top: 1px solid var(--border); background: var(--panel); padding: 14px 20px;
  }
  .inputbar { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 11px; padding: 11px 14px;
    font: inherit; line-height: 1.5; max-height: 140px; min-height: 46px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    cursor: pointer; border: none; border-radius: 11px; padding: 0 20px;
    height: 46px; font-size: 14.5px; font-weight: 600; transition: .15s;
  }
  #send { background: var(--accent); color: #fff; }
  #send:hover { filter: brightness(1.12); }
  #send:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  #stop { background: var(--panel2); color: var(--danger); border: 1px solid var(--danger); display: none; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>📚 知识库问答</h1>
  <div class="pills" id="pills"><span class="pill">加载配置…</span></div>
</header>

<main><div class="wrap" id="chat">
  <div class="empty" id="empty">
    <h2>基于知识库的 RAG 问答</h2>
    <p>检索 → 混合召回 → 重排 → 流式生成（带引用来源）</p>
    <div class="examples">
      <div class="chip">团队版多少钱，几个人可以用？</div>
      <div class="chip">退款流程怎么走，能保留多久？</div>
      <div class="chip">API 鉴权失败怎么办？</div>
    </div>
  </div>
</div></main>

<footer><div class="inputbar">
  <textarea id="q" rows="1" placeholder="输入问题，Enter 发送 / Shift+Enter 换行"></textarea>
  <button id="stop">停止</button>
  <button id="send">发送</button>
</div><div class="hint">原生 FastAPI + SSE 流式输出 · scripts/06_web.py</div></footer>

<script>
const $ = s => document.querySelector(s);
let busy = false, controller = null;

async function loadConfig() {
  try {
    const c = await (await fetch('/api/config')).json();
    $('#pills').innerHTML = `
      <span class="pill">分块 <b>${c.chunk_strategy}</b></span>
      <span class="pill">召回 <b>${c.retrieval_mode}</b></span>
      <span class="pill">向量库 <b>${c.vector_store}</b></span>
      <span class="pill">chunks <b>${c.chunks}</b></span>`;
  } catch (e) { $('#pills').innerHTML = '<span class="pill">配置加载失败</span>'; }
}
loadConfig();

function addMsg(role) {
  $('#empty')?.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="bubble"></div>';
  $('#chat').appendChild(div);
  div.scrollIntoView({behavior: 'smooth', block: 'end'});
  return div.querySelector('.bubble');
}
const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const citeHtml = t => esc(t).replace(/\[(\d+)\]/g,
  '<span class="cite" title="查看下方来源卡片">[$1]</span>');

async function ask(question) {
  if (busy) return; busy = true;
  $('#send').disabled = true; $('#stop').style.display = 'block';
  addMsg('user').textContent = question;
  const bot = addMsg('bot');
  bot.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

  let text = '', sources = null;
  controller = new AbortController();
  try {
    const resp = await fetch('/api/query?q=' + encodeURIComponent(question),
                             {signal: controller.signal});
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      // SSE 帧以空行分隔：event: xxx \n data: {...} \n\n
      const frames = buf.split('\n\n'); buf = frames.pop();
      for (const f of frames) {
        const ev = /event: (.*)/.exec(f), dt = /data: (.*)/.exec(f);
        if (!ev || !dt) continue;
        const data = JSON.parse(dt[1]);
        if (ev[1] === 'sources') sources = data;
        else if (ev[1] === 'token') { text += data.t; bot.textContent = text;
                                      bot.scrollIntoView({block:'end'}); }
        else if (ev[1] === 'error')  throw new Error(data.message);
      }
    }
    bot.innerHTML = citeHtml(text);
    if (sources?.length) {
      const box = document.createElement('div');
      box.className = 'sources';
      box.innerHTML = sources.map(s => `
        <div class="src" title="${esc(s.text)}">
          <div class="head"><span class="n">${s.n}</span><span class="doc">${esc(s.doc_id)}</span></div>
          <div class="txt">${esc(s.text)}</div>
        </div>`).join('');
      bot.parentElement.appendChild(box);
    }
    $('#empty') === null && loadConfig();   // 数据可能因重建变化，刷新配置徽标
  } catch (e) {
    if (e.name !== 'AbortError')
      bot.innerHTML = `<div class="err">出错了：${esc(e.message)}</div>`;
    else bot.textContent = text || '（已停止）';
  } finally {
    busy = false; controller = null;
    $('#send').disabled = false; $('#stop').style.display = 'none';
    $('#chat').lastElementChild.scrollIntoView({behavior:'smooth', block:'end'});
  }
}

$('#send').onclick = () => { const v = $('#q').value.trim(); if (v && !busy) { $('#q').value=''; ask(v); } };
$('#stop').onclick  = () => controller?.abort();
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#send').click(); }
});
document.querySelectorAll('.chip').forEach(c =>
  c.addEventListener('click', () => ask(c.textContent.trim())));
</script>
</body>
</html>
